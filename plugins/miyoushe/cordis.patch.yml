# dsh bundle patch for @local/miyoushe —— 把本插件插入 profile 的组合层（loader row）。
#
# 生效依据＝**包内 `dsh.bundle.patch` 指针**（见 package.json）：宿主把每个 bundle 的该字段所指文件
#   解析成 patch 后再组成 loader 树（读点：@deepseek-ai/dsh-web-app/lib/index.js 顶部注释把该字段的
#   文档名写作 `cordis.patch.yml`；@deepseek-ai/dsh/lib/profile-boot-*.js 的 `allPatches()` 依次
#   拼接 bundlePatches → profile.patches → homePatches）。⇒ 文件名本身不决定生效，**指针决定**；
#   本包按宿主的文档名取 `cordis.patch.yml`，并同时保留同内容的 `dsh-bundle-patch.yml`
#   （与 `静态化/dsh-adapter`、`静态化/sandbox` 的既有命名对齐）。
#
# ⚠️ 本行的 `id` 必须与 `dsh-data/sandbox-manifest.yml` 的条目 id 一致（`miyoushe`），
#    否则 bundles 路径与 sandbox 路径会创建两个不同 id 的 loader row。
- insert:
    - id: miyoushe
      name: '@local/miyoushe'
