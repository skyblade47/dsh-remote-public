# dsh bundle patch for @local/miyoushe（与 cordis.patch.yml **内容一致**，保留既有工程的另一种命名）
#
# 生效依据＝**包内 `dsh.bundle.patch` 指针**决定读哪个文件（本包指向 `./cordis.patch.yml`）；
#   两个文件名在既有工程中都在用且都生效：`静态化/dsh-adapter`、`静态化/sandbox` 用本文件名，
#   `静态化/skill-center`、`静态化/taskkit` 用 `cordis.patch.yml`。详见证据 §A1 的读取点。
#
# ⚠️ `id` 必须与 `dsh-data/sandbox-manifest.yml` 的条目 id 一致（`miyoushe`）。
- insert:
    - id: miyoushe
      name: '@local/miyoushe'
