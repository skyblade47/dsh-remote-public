# DSH 服务器版 —— journald 容量上限（drop-in）
#
# 安装位置：/etc/systemd/journald.conf.d/50-dsh.conf（由 deploy/linux/setup.sh 落盘）
# 生效方式：sudo systemctl restart systemd-journald
#
# ── 为什么要设 ────────────────────────────────────────────────────────────────
# journald 的默认 SystemMaxUse = 该文件系统的 10%（封顶 4 GiB）。
# 在 40 GB 的系统盘上就是 4 GB —— 白占盘的 10%。
#
# 更关键的是：实测 journal 的磁盘占用**主要不是日志内容，而是文件预分配**。
# journald 每建一个新文件就先分配 8 MiB，且**不随内容缩小**（不是稀疏文件）。
# 所以"文件个数"直接等于占用，而文件个数由重启频率决定。
#
# 2026-09-23 WSL 真机实测（数字是测出来的，不是估的）：
#   · /var/log/journal 下 101 个文件，**大小全部一模一样 = 8,388,608 字节**
#   · 表观合计 808 MB / du 实占 719 MB，而**真实日志内容只有 945,173 字节、6375 行**
#     ⇒ 99.9% 是预分配的空壳
#   · 同一时间窗内 dsh-kernel / dsh-remote 的日志条数 = **0**（服务是停的）
#   · 该窗口 10 小时内开关机 11 次 ⇒ 那批空壳是频繁启停堆出来的，与 DSH 无关
#
# 收 SystemMaxFileSize 的理由：单文件上限决定"一个薄文件最多浪费多少"，
# 收 SystemMaxUse 的理由：总量上限才真正封住"文件数 × 8 MiB"的堆积。
# 500 MB 相当于把 journal 压到 40 GB 盘的 1.25%（默认是 10%）。
#
# ── 不要关掉它 ────────────────────────────────────────────────────────────────
# ⛔ 不要设 Storage=none / 不要停 journald：
#   · check-ready.sh 要从 journal 里取带 token 的访问 URL
#   · journal 是唯一的全量 stdout/stderr（崩溃堆栈 / OOM / 开停机）⇒ 故障排查全靠它
#   本文件只做"封顶"，不做"关闭"。
#
# ── 口径提醒 ──────────────────────────────────────────────────────────────────
# journalctl --disk-usage 与 du 报数会差近一倍（实测 349.6M vs 719M，原因未查清，
# 疑与未封印的 .journal~ 文件有关）。判断"占了多少盘"以 du 为准。

[Journal]
# 总量上限（默认 = 盘的 10%，封顶 4 GiB）
SystemMaxUse=500M
# 单文件上限（默认 = SystemMaxUse 的 1/8）；下限受 journald 的 8 MiB 预分配约束
SystemMaxFileSize=50M
